<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek CV Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://kit.fontawesome.com/a2d9b7f6c8.js" crossorigin="anonymous"></script>
    <style>
      .loading {
        width: 20px;
        height: 20px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .template-card {
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .template-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <!--  Added ID here -->
        <a id="brandTitle" class="navbar-brand fw-bold text-primary" href="/">
          <i class="fas fa-magic me-2"></i>Resume Builder
        </a>
        <div>
          <label class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="languageToggle">
            <span id="languageLabel" class="ms-2">English</span>
          </label>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      {% block content %}{% endblock %}
    </main>

    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;"></div>

    <input type="hidden" id="selectedTemplate" value="modern">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>

    <!--  NEW: Simple script for title + brand switch -->
<script>
  document.getElementById('languageToggle').addEventListener('change', function() {
    const isArabic = this.checked;
    const html = document.documentElement;
    const titleEl = document.querySelector('title');
    const brandEl = document.getElementById('brandTitle');
    const labelEl = document.getElementById('languageLabel');

    // Switch base title + navbar
    if (isArabic) {
      html.lang = 'ar';
      html.dir = 'rtl';
      titleEl.textContent = 'مُنشئ سيرة ذاتية';
      brandEl.innerHTML = '<i class="fas fa-magic me-2"></i>مُنشئ سيرة ذاتية';
      labelEl.textContent = 'العربية';
    } else {
      html.lang = 'en';
      html.dir = 'ltr';
      titleEl.textContent = 'DeepSeek CV Generator';
      brandEl.innerHTML = '<i class="fas fa-magic me-2"></i>Resume Builder';
      labelEl.textContent = 'English';
    }

    //  Switch all page texts with data-en / data-ar attributes
    document.querySelectorAll('[data-en][data-ar]').forEach(el => {
      el.textContent = isArabic ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    });
        document.querySelectorAll('[data-en-placeholder][data-ar-placeholder]').forEach(el => {
      el.placeholder = isArabic 
        ? el.getAttribute('data-ar-placeholder') 
        : el.getAttribute('data-en-placeholder');
    });
  });
</script>
  </body>

</html>
